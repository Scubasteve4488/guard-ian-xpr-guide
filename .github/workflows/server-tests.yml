# Runs the connector's unit tests (network stubbed, no secrets) on every push and pull request that touches the server
# or the guide files the tests read. Read-only: no deploy step, no tokens.
name: server-tests
on:
  push:
    paths: ['server/**', '*.md', 'llms.txt', '.github/workflows/server-tests.yml']
  pull_request:
    paths: ['server/**', '*.md', 'llms.txt', '.github/workflows/server-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
